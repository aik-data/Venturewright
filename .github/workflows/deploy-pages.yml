# Builds the static site and publishes it to GitHub Pages.
#
# The site address is read from the repository's Pages settings at build time
# (actions/configure-pages), so the same workflow serves both targets with no
# edits:
#
#   No custom domain   https://<owner>.github.io/<repo>/  sub-path, noindex
#   Custom domain set  https://venturewrightco.com/        root, indexable
#
# ONE-TIME SETUP (repository owner, on github.com)
#   1. Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
#      The workflow token cannot turn Pages on by itself.
#   2. For the real domain: Settings -> Pages -> Custom domain ->
#      venturewrightco.com, add the DNS records listed in the README, then tick
#      Enforce HTTPS. Re-run this workflow afterwards so the build picks up
#      the domain.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/venturewright-website-yr0lw9
      - claude/sweet-archimedes-h2al2h
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      # Reads the live Pages configuration: origin and base path follow the
      # custom domain when one is set, and the github.io sub-path otherwise.
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Keep the github.io preview out of search; index the real domain.
          NEXT_PUBLIC_NOINDEX: ${{ endsWith(steps.pages.outputs.host, 'github.io') }}
        run: npm run build

      - name: Bypass Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
